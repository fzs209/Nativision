name: Build Nativision

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create temporary signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=LocalDev" `
            -KeyUsage DigitalSignature -FriendlyName "Nativision CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "NativisionCI" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "$env:GITHUB_WORKSPACE\Nativision\Nativision_TemporaryKey.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "$env:GITHUB_WORKSPACE\Nativision_TemporaryKey.cer" | Out-Null
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Restore NuGet packages
        shell: powershell
        run: msbuild Nativision\Nativision.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build sideload package
        shell: powershell
        run: |
          msbuild Nativision\Nativision.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\Nativision\Nativision_TemporaryKey.pfx" `
            /p:PackageCertificatePassword=NativisionCI `
            /p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifact" | Out-Null
          $pkgDir = Get-ChildItem -Path "Nativision\AppPackages" -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($pkgDir) {
            Copy-Item -Path (Join-Path $pkgDir.FullName "*") -Destination "$env:GITHUB_WORKSPACE\artifact" -Recurse
          }
          Copy-Item -Path "Nativision_TemporaryKey.cer" -Destination "$env:GITHUB_WORKSPACE\artifact" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\artifact" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nativision-package
          path: artifact/**
          if-no-files-found: error
