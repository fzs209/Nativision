name: Build Nativision

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WinUI 3 desktop app (unpackaged, self-contained)
        shell: powershell
        run: |
          dotnet publish Nativision\Nativision.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "$env:GITHUB_WORKSPACE\publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish" | ForEach-Object { Write-Host $_.Name }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nativision-winui3
          path: publish/**
          if-no-files-found: error
